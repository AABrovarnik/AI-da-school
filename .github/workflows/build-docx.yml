name: Build full MD and DOCX

on:
  push:
    paths:
      - '.staging/tz-full.md.gz.b64'
      - '.github/workflows/build-docx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full Markdown
        run: |
          mkdir -p docs
          base64 -d .staging/tz-full.md.gz.b64 | gzip -d > docs/VibeCode_School_TZ_v1.0.md

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate DOCX
        run: |
          pandoc docs/VibeCode_School_TZ_v1.0.md \
            -o docs/VibeCode_School_TZ_v1.0.docx \
            --from=gfm \
            --standalone

      - name: Commit full documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VibeCode_School_TZ_v1.0.md docs/VibeCode_School_TZ_v1.0.docx
          if git diff --cached --quiet; then
            echo "Documents unchanged"
          else
            git commit -m "Publish full VibeCode School technical specification"
            git push
          fi
